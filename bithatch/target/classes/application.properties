# ==========================================
# CONFIGURACIÓN DE BASE DE DATOS (H2 - MEMORIA)
# ==========================================
spring.datasource.url=jdbc:h2:mem:bithatchdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Habilita la consola web para ver la BBDD en el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==========================================
# update: Crea las tablas automáticamente si no existen
spring.jpa.hibernate.ddl-auto=update
# true: Muestra las consultas SQL en la consola (útil para debug)
spring.jpa.show-sql=true

